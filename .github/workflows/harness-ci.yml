name: harness-ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same pinned, checked tools every project uses (meta-0011) — nothing
      # system-wide. The real download and checksum path runs on every push.
      - name: Fetch the pinned tools into harness/deps
        run: |
          bash harness/deps/setup.sh
          bash harness/deps/setup.sh --check
          echo "$PWD/harness/deps/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: |
          shellcheck -x harness/gates/*.sh harness/init.sh harness/tests/gates/*.sh \
                        harness/deps/*.sh tools/*.sh skills/mermaid-render/render.sh

      - name: Gate self-tests
        run: bash harness/tests/gates/test_gates.sh

      - name: Scaffold into a clean project and self-test there
        run: |
          bash harness/init.sh /tmp/scaffold-check --name ci-demo --no-git
          S=/tmp/scaffold-check/harness

          # The tools travel as script + pins, never as fetched binaries.
          test -f "$S/deps/setup.sh" && test -f "$S/deps/deps.lock" && test -f "$S/deps/render.sh"
          test ! -e "$S/deps/bin" && test ! -e "$S/deps/vendor"
          # Strictly local: with deps/bin empty the gates refuse, system yq or not.
          if bash "$S/gates/discover.sh" 2>/dev/null; then
            echo "::error::gates ran without harness/deps/bin"; exit 1
          fi
          cp -r harness/deps/bin harness/deps/vendor "$S/deps/"
          bash "$S/deps/setup.sh" --check

          # A fresh scaffold must start clean. State lives in status.yaml:
          test "$(yq '.current_phase' "$S/status.yaml")" = "discover"
          test "$(yq '[.phases[].gate_passed] | any' "$S/status.yaml")" = "false"
          test "$(yq '.iterations | length' "$S/status.yaml")" = "0"
          test "$(yq '.autopilot.enabled' "$S/status.yaml")" = "false"
          test ! -e "$S/docs/user_stories/US-001"*.md

          # ...and approvals live in the artifacts, not in status.yaml, since
          # meta-0004 replaced the hash registry with `approved_by:` markers.
          # Scope this to artifact-shaped files: the READMEs and templates
          # document the marker syntax and would match a naive pattern.
          # `|| true` because grep exits 1 on no match, which is the pass case.
          approved=$(find "$S/docs" "$S/tests/features" \
            \( -name 'US-*.md' -o -name '000*.md' -o -name 'plan.md' \
               -o -name 'ITER-*.md' -o -name 'US-*.feature' \) \
            -exec grep -lE '^(#[[:space:]]*)?approved_by:[[:space:]]*[^[:space:]#]' {} + || true)
          if [ -n "$approved" ]; then
            echo "::error::fresh scaffold ships pre-filled approvals: $approved"
            exit 1
          fi

          bash "$S/tests/gates/test_gates.sh"

      - name: Scaffold per agent target
        run: |
          bash harness/init.sh /tmp/t-claude --no-git --target claude
          test -f /tmp/t-claude/.claude/commands/harness.md
          test ! -e /tmp/t-claude/.opencode
          bash harness/init.sh /tmp/t-opencode --no-git --target opencode
          test -f /tmp/t-opencode/.opencode/commands/harness.md
          test ! -e /tmp/t-opencode/.claude
          if bash harness/init.sh /tmp/t-bad --no-git --target vim 2>/dev/null; then
            echo "::error::init.sh accepted an unknown --target"
            exit 1
          fi

      - name: Skill assets in sync with repo
        run: bash tools/sync-skill.sh --check

      - name: Scaffold from the skill's bundled copy
        run: |
          bash skills/harness-init/assets/harness/init.sh /tmp/skill-check --name skill-demo --no-git
          cp -r harness/deps/bin harness/deps/vendor /tmp/skill-check/harness/deps/
          bash /tmp/skill-check/harness/deps/setup.sh --check
          bash /tmp/skill-check/harness/tests/gates/test_gates.sh

      # No removed concept still taught, /harness commands match harness/glue/,
      # and the live workflow version has an approved meta ADR behind it.
      - name: Repo consistency
        run: bash tools/check-repo.sh

      - name: Skills install, verify and package
        run: |
          export CLAUDE_SKILLS_DIR=/tmp/skills
          bash tools/install-skills.sh
          bash tools/install-skills.sh --check
          export OPENCODE_SKILLS_DIR=/tmp/oc-skills
          bash tools/install-skills.sh --target opencode
          test -f /tmp/oc-skills/mermaid-render/render.sh
          bash tools/install-skills.sh --check --target all
          # A stale installed copy must be reported, not waved through.
          echo "drift" >> /tmp/skills/harness-init/SKILL.md
          if bash tools/install-skills.sh --check; then
            echo "::error::install-skills.sh --check passed on a modified copy"
            exit 1
          fi
          bash tools/package-skill.sh /tmp/dist
          unzip -l /tmp/dist/harness-init.zip | grep -q 'harness-init/SKILL.md'
          unzip -l /tmp/dist/harness-init.zip | grep -q 'harness-init/VERSION'
          unzip -l /tmp/dist/mermaid-render.zip | grep -q 'mermaid-render/render.sh'
