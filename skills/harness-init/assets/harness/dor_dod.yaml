version: 4

# Human checklists. A subset is machine-enforced: each gate checks its
# predecessor's gate_passed flag in status.yaml, and approvals are checked
# as `approved_by:` markers in the artifacts themselves (no hashes — the
# marker is written by the agent after the user approves in conversation).
# Items marked (manual) are review items with no automated check.

discover:
  definition_of_ready:
    - prd_exists
    - prd_has_problem_section
    - prd_has_goals
    - prd_has_non_functional_requirements
    - prd_has_success_criteria
    - user_is_available_for_interview
  definition_of_done:
    - all_user_stories_approved
    - one_feature_file_per_story
    - traceability_frontmatter_on_each_story
    - status_yaml_phase_discover_completed_true

architect:
  definition_of_ready:
    - discover_gate_passed
    - all_stories_approved
  definition_of_done:
    - all_load_bearing_decisions_have_adr
    - adr_count_le_3
    - all_adrs_approved
    - architecture_md_has_c4_levels_and_cross_cutting
    - status_yaml_phase_architect_completed_true

model:
  definition_of_ready:
    - architect_gate_passed
    - all_adrs_approved
  definition_of_done:
    - c4_context_diagram_exists
    - c4_container_diagram_exists
    - c4_component_diagram_exists
    - sequence_diagram_for_each_key_flow
    - state_diagram_for_each_lifecycle
    - every_diagram_has_traceability_frontmatter
    - architecture_md_links_diagrams
    - diagrams_rendered_and_reviewed_by_user (manual)
    - status_yaml_phase_model_completed_true

plan:
  definition_of_ready:
    - model_gate_passed
    - all_stories_approved
  definition_of_done:
    - iterations_are_vertical_slices (manual)
    - every_story_covered_by_some_iteration
    - iteration_frontmatter_matches_table (manual)
    - plan_approved
    - status_yaml_phase_plan_completed_true

design:
  definition_of_ready:
    - plan_gate_passed
    - current_iteration_set
  definition_of_done:
    - iteration_file_has_goal_approach_components_test_strategy
    - at_least_one_mermaid_diagram
    - rendered_html_fresh_when_the_design_is_approved
    - user_actually_looked_at_the_rendered_design (manual)
    - iteration_design_approved
    - iteration_design_gate_passed_true

implement:
  definition_of_ready:
    - iteration_design_gate_passed
    - every_iteration_story_has_a_feature_file
  definition_of_done:
    - one_failing_test_per_acceptance_criterion
    - all_tests_pass
    - lint_clean
    - no_todo_in_delivered_code
    - idempotency_keys_unique_per_logical_action (manual)
    - iteration_implement_gate_passed_true

verify:
  definition_of_ready:
    - iteration_implement_gate_passed
    - tests_pass
    - lint_clean
  definition_of_done:
    - verification_section_reports_every_iteration_story
    - all_verification_items_checked
    - iteration_verify_gate_passed_true

release:
  definition_of_ready:
    - all_planned_iterations_verified
  definition_of_done:
    - e2e_run_recorded
    - prd_success_criteria_verified
    - nfr_targets_measured
    - verify_report_md_complete
    - no_open_decisions
    - retro_written (manual)
    - status_yaml_phase_release_completed_true
